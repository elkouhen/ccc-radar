[project]
name = "systemlens"
version = "0.1.0"
description = "Indexe findings, code et signaux d'architecture interrogeables par agent"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
    "typer>=0.12",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "mcp>=1.0",
    "sqlite-vec>=0.1.9",
    "tree-sitter>=0.24,<0.25",
    "tree-sitter-java>=0.23",
]

[project.scripts]
systemlens = "systemlens.cli:app"

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "playwright>=1.50",
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/systemlens"]

[tool.pytest.ini_options]
addopts = "-m 'not slow'"
markers = [
    "integration: tests d'intégration avec des dépendances externes",
    "slow: tests lents (téléchargement de modèle, etc.)",
]

[tool.mypy]
python_version = "3.13"
files = ["src/systemlens"]
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
check_untyped_defs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "systemlens.*"
disallow_untyped_defs = false
