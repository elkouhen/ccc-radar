<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SystemLens software layers</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/graphology/0.25.4/graphology.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/sigma.js/2.4.0/sigma.min.js"></script>
  <style>
    :root { color: #172033; background: #f5f7fb; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; overflow: hidden; }
    #graph { width: 100vw; height: 100vh; background: #f8fafc; touch-action: none; }
    #containers { position: fixed; inset: 0; z-index: 1; pointer-events: none; overflow: hidden; }
    .layer-band { position: absolute; border-top: 1px solid color-mix(in srgb, var(--layer-color) 42%, transparent); border-bottom: 1px solid color-mix(in srgb, var(--layer-color) 18%, transparent); background: color-mix(in srgb, var(--layer-color) 4%, transparent); }
    .layer-label { position: absolute; left: 10px; top: 7px; color: var(--layer-color); font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
    .namespace-box { position: absolute; border: 1px dashed color-mix(in srgb, var(--layer-color) 68%, transparent); border-radius: 10px; background: color-mix(in srgb, var(--layer-color) 8%, transparent); }
    .namespace-label { position: absolute; left: 10px; top: 7px; color: var(--layer-color); font-size: 10px; font-weight: 750; }
    .toolbar { position: fixed; z-index: 2; top: 16px; left: 16px; display: flex; align-items: center; gap: 8px; padding: 8px; border: 1px solid #d7dee9; border-radius: 6px; background: rgba(255,255,255,.95); box-shadow: 0 2px 12px rgba(15,23,42,.10); }
    .toolbar strong { padding: 0 6px; font-size: 14px; white-space: nowrap; }
    .toolbar input { width: 230px; height: 32px; padding: 0 9px; border: 1px solid #b9c5d6; border-radius: 4px; font: inherit; font-size: 13px; }
    .toolbar button { width: 32px; height: 32px; border: 1px solid #b9c5d6; border-radius: 4px; color: #315f9b; background: #fff; font-size: 19px; cursor: pointer; }
    .toolbar button:hover { background: #eaf2ff; }
    #legend { position: fixed; z-index: 2; left: 16px; bottom: 16px; display: flex; flex-wrap: wrap; gap: 8px 14px; max-width: min(680px, calc(100vw - 32px)); padding: 10px 12px; border: 1px solid #d7dee9; border-radius: 6px; background: rgba(255,255,255,.95); font-size: 12px; box-shadow: 0 2px 12px rgba(15,23,42,.10); }
    .legend-item { display: inline-flex; align-items: center; gap: 5px; }
    .legend-color { width: 10px; height: 10px; border-radius: 50%; }
    #details { position: fixed; z-index: 2; right: 16px; bottom: 16px; width: min(350px, calc(100vw - 32px)); max-height: min(56vh, 440px); overflow: auto; padding: 10px 12px; border: 1px solid #d7dee9; border-radius: 6px; background: rgba(255,255,255,.95); color: #475569; font-size: 13px; line-height: 1.4; box-shadow: 0 2px 12px rgba(15,23,42,.10); }
    #details strong { display: block; color: #172033; font-size: 14px; }
    #details h2 { margin: 10px 0 4px; color: #59708d; font-size: 11px; font-weight: 700; text-transform: uppercase; }
    #details ul { margin: 0; padding-left: 18px; }
  </style>
</head>
<body>
  <div class="toolbar">
    <strong>Software layers</strong>
    <input id="search" type="search" placeholder="Search a module" autocomplete="off" aria-label="Search a module">
    <button id="zoom-out" type="button" aria-label="Zoom out">-</button>
    <button id="zoom-in" type="button" aria-label="Zoom in">+</button>
    <button id="fit-view" type="button" aria-label="Fit view">o</button>
    <button id="reset" type="button" aria-label="Reset selection">x</button>
  </div>
  <div id="legend"></div>
  <div id="containers" aria-hidden="true"></div>
  <div id="details">Select a module to explore its layer and direct dependencies.</div>
  <div id="graph" aria-label="Software layers graph"></div>
  <script id="software-layers-data" type="application/json">__SOFTWARE_LAYERS_DATA__</script>
  <script>
    const graphData = JSON.parse(document.getElementById("software-layers-data").textContent);
    const nodeById = new Map(graphData.nodes.map(node => [node.id, node]));
    const network = new graphology.MultiDirectedGraph();
    graphData.nodes.forEach(node => network.addNode(node.id, {
      label: node.name, x: node.x, y: node.y, size: node.layer === "domain" ? 14 : 11, color: node.color,
    }));
    graphData.links.forEach((link, index) => network.addEdgeWithKey(`dependency-${index}`, link.source, link.target, { size: 1.4, color: "#64748b" }));
    const legend = document.getElementById("legend");
    graphData.layers.forEach(layer => {
      const item = document.createElement("span"); item.className = "legend-item";
      const dot = document.createElement("span"); dot.className = "legend-color"; dot.style.background = layer.color;
      item.append(dot, document.createTextNode(layer.label)); legend.append(item);
    });
    let selectedId = null; let relatedNodes = null; let relatedEdges = null;
    const renderer = new Sigma(network, document.getElementById("graph"), {
      labelDensity: .1, labelGridCellSize: 120, labelRenderedSizeThreshold: 7,
      nodeReducer: (node, data) => !selectedId || relatedNodes.has(node) ? data : { ...data, color: "#d8e0ea", label: "" },
      edgeReducer: (edge, data) => !selectedId || relatedEdges.has(edge) ? data : { ...data, color: "#e5eaf0", size: .35 },
    });
    const containers = document.getElementById("containers");
    function refreshContainers() {
      containers.replaceChildren();
      const layerAreas = new Map();
      graphData.namespace_groups.forEach(group => {
        const points = group.node_ids.map(id => {
          const display = renderer.getNodeDisplayData(id);
          return display ? renderer.graphToViewport(display) : null;
        }).filter(Boolean);
        if (!points.length) return;
        const layer = graphData.layers.find(item => item.id === group.layer);
        const minX = Math.min(...points.map(point => point.x)) - 62;
        const maxX = Math.max(...points.map(point => point.x)) + 62;
        const minY = Math.min(...points.map(point => point.y)) - 44;
        const maxY = Math.max(...points.map(point => point.y)) + 44;
        layerAreas.set(group.layer, [...(layerAreas.get(group.layer) || []), { minY, maxY }]);
        const box = document.createElement("div");
        box.className = "namespace-box";
        box.style.left = `${minX}px`; box.style.top = `${minY}px`;
        box.style.width = `${Math.max(150, maxX - minX)}px`; box.style.height = `${Math.max(92, maxY - minY)}px`;
        box.style.setProperty("--layer-color", layer.color);
        const label = document.createElement("span"); label.className = "namespace-label"; label.textContent = group.namespace;
        box.append(label); containers.append(box);
      });
      const layerCenters = graphData.layers
        .map(layer => ({ layer, point: renderer.graphToViewport({ x: 0, y: layer.y }) }))
        .sort((left, right) => left.point.y - right.point.y);
      layerCenters.forEach(({ layer }, index) => {
        const areas = layerAreas.get(layer.id) || []; if (!areas.length) return;
        const center = renderer.graphToViewport({ x: 0, y: layer.y }).y;
        const previous = layerCenters[index - 1]?.point.y;
        const next = layerCenters[index + 1]?.point.y;
        const upperGap = previous === undefined ? (next === undefined ? 120 : next - center) : center - previous;
        const lowerGap = next === undefined ? upperGap : next - center;
        const minY = Math.max(0, center - upperGap / 2);
        const maxY = Math.min(window.innerHeight, center + lowerGap / 2);
        const band = document.createElement("div"); band.className = "layer-band";
        band.style.left = "0px"; band.style.top = `${minY}px`; band.style.width = `${window.innerWidth}px`; band.style.height = `${maxY - minY}px`;
        band.style.setProperty("--layer-color", layer.color);
        const label = document.createElement("span"); label.className = "layer-label"; label.textContent = layer.label;
        band.append(label); containers.prepend(band);
      });
    }
    const details = document.getElementById("details");
    function appendList(title, values) {
      if (!values.length) return;
      const heading = document.createElement("h2"); heading.textContent = title;
      const list = document.createElement("ul"); values.forEach(value => { const item = document.createElement("li"); item.textContent = value; list.append(item); });
      details.append(heading, list);
    }
    function selectModule(id) {
      selectedId = id; relatedNodes = new Set([id]); relatedEdges = new Set(); const dependencies = []; const dependents = [];
      network.forEachEdge((edge, attributes, source, target) => {
        if (source === id || target === id) { relatedEdges.add(edge); relatedNodes.add(source); relatedNodes.add(target); if (source === id) dependencies.push(nodeById.get(target).name); else dependents.push(nodeById.get(source).name); }
      });
      renderer.refresh(); const node = nodeById.get(id); details.replaceChildren();
      const title = document.createElement("strong"); title.textContent = node.name; details.append(title, document.createTextNode(`${node.layerLabel} · ${node.kind}`));
      appendList("HTTP APIs exposed", node.httpApisExposed); appendList("Topics published", node.kafkaTopicsPublished); appendList("Topics consumed", node.kafkaTopicsConsumed); appendList("Depends on", dependencies); appendList("Used by", dependents);
      const position = renderer.getNodeDisplayData(id); if (position) renderer.getCamera().animate({ x: position.x, y: position.y, ratio: .55 }, { duration: 260 });
    }
    function reset() { selectedId = null; relatedNodes = null; relatedEdges = null; renderer.refresh(); details.textContent = "Select a module to explore its layer and direct dependencies."; document.getElementById("search").value = ""; }
    renderer.on("clickNode", ({ node }) => selectModule(node)); renderer.on("clickStage", reset);
    renderer.on("afterRender", refreshContainers);
    renderer.getCamera().on("updated", refreshContainers);
    document.getElementById("zoom-in").addEventListener("click", () => renderer.getCamera().animatedZoom({ duration: 180 }));
    document.getElementById("zoom-out").addEventListener("click", () => renderer.getCamera().animatedUnzoom({ duration: 180 }));
    document.getElementById("fit-view").addEventListener("click", () => renderer.getCamera().animatedReset({ duration: 220 }));
    document.getElementById("reset").addEventListener("click", reset);
    document.getElementById("search").addEventListener("input", event => { const query = event.target.value.trim().toLocaleLowerCase(); const node = graphData.nodes.find(item => item.name.toLocaleLowerCase().includes(query)); if (node) selectModule(node.id); else if (!query) reset(); });
    window.addEventListener("resize", () => { renderer.refresh(); refreshContainers(); });
  </script>
</body>
</html>
